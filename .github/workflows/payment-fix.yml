name: Payment Flow Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply payment changes
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          # Remove Auto Approve button.
          s = re.sub(r'^\s*\[Markup\.button\.callback\("⚡ Auto Approve Payment", "auto_payment"\)\],?\s*\n', '', s, flags=re.M)

          # Remove every auto_payment action registration.
          s = re.sub(r'\nbot\.action\("auto_payment".*?\n\}\);\s*', '\n', s, flags=re.S)

          # Remove the auto payment check section.
          s = re.sub(r'\n// ================= AUTO PAYMENT CHECK =================.*?(?=\n// ================= PAYMENT MESSAGE HANDLER =================)', '\n', s, flags=re.S)

          # Remove the complete auto QR payment function.
          s = re.sub(r'\n// ================= AUTO QR PAYMENT =================.*?(?=\n// ================= MANUAL PAYMENT =================)', '\n', s, flags=re.S)
          s = re.sub(r'\nasync function sendAutoPayment\(ctx, amount, credits\)\s*\{.*?(?=\n(?:bot\.action|// ================= MANUAL PAYMENT =================))', '\n', s, flags=re.S)

          # Manual payment only.
          s = s.replace('async function askPaymentAmount(ctx, method){', 'async function askPaymentAmount(ctx){')
          s = s.replace('paymentInput.set(String(ctx.from.id), method);', 'paymentInput.set(String(ctx.from.id), "MANUAL");')
          s = s.replace('`💳 ${method === "AUTO" ? "AUTO APPROVE PAYMENT" : "PAY BY BOT"}', '`💳 PAY BY BOT')
          s = s.replace('if(input === "AUTO" || input === "MANUAL"){', 'if(input === "MANUAL"){')
          s = re.sub(r'\s*return input === "AUTO"\s*\? sendAutoPayment\(ctx, amount, credits\)\s*: sendManualPayment\(ctx, amount, credits\);', '\n        return sendManualPayment(ctx, amount, credits);', s)

          # Remove AUTO from payment schema.
          s = s.replace('enum: ["AUTO", "MANUAL"]', 'enum: ["MANUAL"]')

          # No Auto wording in payment settings.
          s = s.replace('\\n⏱ Auto QR Expiry: 3 minutes', '')
          s = s.replace('⏱ Auto QR Expiry: 3 minutes\\n', '')

          # Expiry must return to Pay by Bot, never auto payment.
          s = s.replace('Markup.button.callback("🔄 Generate New QR", "auto_payment")', 'Markup.button.callback("🔄 Generate New Payment", "manual_payment")')

          p.write_text(s, encoding='utf-8')
      - name: Verify and commit
        run: |
          node --check index.js
          if grep -n -E 'Auto Approve Payment|auto_payment|sendAutoPayment|AUTO QR PAYMENT|check_payment_' index.js; then
            echo 'Auto payment references remain'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet || git commit -m "fix: remove auto approve payment system completely"
          git push
