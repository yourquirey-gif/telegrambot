name: Strict Force Join Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.js
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          # Add persistent chat id for private/public channels.
          s = s.replace('''const forceSchema = new mongoose.Schema({\n\n   channel: String,\n\n   joinLink: {''', '''const forceSchema = new mongoose.Schema({\n\n   channel: String,\n\n   chatId: {\n      type: String,\n      default: null\n   },\n\n   joinLink: {''', 1)

          marker = '// ================= FORCE JOIN CHECK ================='
          management = r'''// ================= STRICT FORCE JOIN MANAGEMENT =================

async function resolveForceChat(ctx){
    const msg = ctx.message || {};
    const reply = msg.reply_to_message;
    const origin = msg.forward_origin || (reply && reply.forward_origin);
    if(origin && origin.type === "channel" && origin.chat) return origin.chat;
    const parts = String(msg.text || "").trim().split(/\s+/);
    return parts[1] || null;
}

async function addStrictForceChannel(ctx, ref){
    const chat = await ctx.telegram.getChat(ref);
    if(!["channel", "supergroup"].includes(chat.type)) throw new Error("❌ Only channels/supergroups can be force-joined.");

    let me;
    try { me = await ctx.telegram.getChatMember(chat.id, ctx.botInfo.id); }
    catch { throw new Error("❌ Bot is not an administrator on this channel.\n\nAdd the bot as ADMIN first and enable Invite Users via Link."); }

    if(me.status !== "administrator" && me.status !== "creator")
        throw new Error("❌ Bot is not an administrator on this channel.\n\nAdd the bot as ADMIN first and enable Invite Users via Link.");
    if(me.status === "administrator" && me.can_invite_users !== true)
        throw new Error("❌ Bot needs the 'Invite Users via Link' permission.\n\nChannel → Administrators → Bot → enable Invite Users via Link.");

    let invite;
    try {
        invite = await ctx.telegram.createChatInviteLink(chat.id, {
            name: `ForceJoin-${Date.now().toString().slice(-8)}`,
            creates_join_request: false
        });
    } catch(err) {
        throw new Error(`❌ Bot cannot generate the invite link.\n\nBot must be ADMIN with Invite Users via Link permission.\n\n${err.description || err.message}`);
    }

    const publicRef = chat.username ? `@${chat.username}` : String(chat.id);
    await ForceChannel.findOneAndUpdate(
        { chatId: String(chat.id) },
        { channel: publicRef, chatId: String(chat.id), joinLink: invite.invite_link, title: chat.title || publicRef },
        { upsert: true, new: true }
    );
    return {chat, invite};
}

bot.command("addforce", async(ctx)=>{
    if(!(await isAdmin(ctx.from.id))) return;
    try {
        const ref = await resolveForceChat(ctx);
        if(!ref) return ctx.reply(`📢 ADD FORCE JOIN\n\n/addforce @channelusername\n\nFor a PRIVATE channel:\n1. Add bot as ADMIN.\n2. Enable Invite Users via Link.\n3. Forward any message from that channel to this bot.\n4. Reply to that forwarded message with /addforce`);
        const result = await addStrictForceChannel(ctx, ref);
        return ctx.reply(`✅ FORCE JOIN ADDED\n\n📢 ${result.chat.title || result.chat.username || result.chat.id}\n🆔 ${result.chat.id}\n\n🔗 Unique Invite Link:\n${result.invite.invite_link}\n\n🔒 Strict force join enabled.`);
    } catch(err) {
        return ctx.reply(err.message || "❌ Could not add force channel.");
    }
});

bot.command("forcechannels", async(ctx)=>{
    if(!(await isAdmin(ctx.from.id))) return;
    const channels = await ForceChannel.find();
    if(!channels.length) return ctx.reply("❌ No force-join channels configured.");
    let out = "🔒 FORCE JOIN CHANNELS\n\n";
    for(const ch of channels){
        let ok = false;
        try {
            const me = await ctx.telegram.getChatMember(ch.chatId || ch.channel, ctx.botInfo.id);
            ok = me.status === "creator" || (me.status === "administrator" && me.can_invite_users === true);
        } catch {}
        out += `📢 ${ch.title || ch.channel}\n${ok ? "✅ Bot ADMIN + invite permission OK" : "❌ Bot must be ADMIN + Invite Users via Link"}\n🔗 ${ch.joinLink || "No link"}\n\n`;
    }
    return ctx.reply(out);
});

bot.command("removeforce", async(ctx)=>{
    if(!(await isAdmin(ctx.from.id))) return;
    const parts = String(ctx.message.text || "").trim().split(/\s+/);
    if(!parts[1]) return ctx.reply("❌ Example: /removeforce -1001234567890");
    const ref = parts[1];
    const q = ref.startsWith("-100") ? {chatId: ref} : {$or:[{chatId:ref},{channel:ref},{channel:ref.replace(/^@/,"")}]};
    const removed = await ForceChannel.findOneAndDelete(q);
    if(!removed) return ctx.reply("❌ Force channel not found.");
    return ctx.reply(`✅ Force channel removed:\n\n${removed.title || removed.channel}`);
});

'''
          if marker not in s:
              raise SystemExit('force marker missing')
          if 'STRICT FORCE JOIN MANAGEMENT' not in s:
              s = s.replace(marker, management + marker, 1)

          # Replace force-join checker.
          pattern = r'async function checkForceJoin\(ctx\)\{.*?\n\}\n// ================= HOME ================='
          replacement = r'''async function checkForceJoin(ctx){
    const channels = await ForceChannel.find();
    const notJoined = [];
    for(const ch of channels){
        const chatId = ch.chatId || ch.channel;
        try {
            const botMember = await ctx.telegram.getChatMember(chatId, ctx.botInfo.id);
            const botOk = botMember.status === "creator" || (botMember.status === "administrator" && botMember.can_invite_users === true);
            if(!botOk){
                notJoined.push({channel:ch.channel, chatId:String(chatId), title:ch.title || ch.channel, joinLink:ch.joinLink, botError:true});
                continue;
            }
            const member = await ctx.telegram.getChatMember(chatId, ctx.from.id);
            if(member.status === "left" || member.status === "kicked") notJoined.push(ch);
        } catch {
            notJoined.push({channel:ch.channel, chatId:String(chatId), title:ch.title || ch.channel, joinLink:ch.joinLink, botError:true});
        }
    }
    return notJoined;
}

async function sendStrictForceJoinPrompt(ctx, list){
    const errors = list.filter(x => x.botError);
    if(errors.length){
        let msg = "🚫 BOT ADMIN REQUIRED\n\n";
        msg += "The bot needs to be ADMIN on these force-join channels:\n\n";
        for(const x of errors) msg += `📢 ${x.title || x.channel}\n`;
        msg += "\nRequired permission: Invite Users via Link.\n\n❌ Bot access is blocked until this is fixed.";
        return ctx.reply(msg);
    }
    const buttons = list.map(x => [Markup.button.url(`📢 Join ${x.title || "Channel"}`, x.joinLink)]);
    buttons.push([Markup.button.callback("✅ Joined", "check_join")]);
    return ctx.reply("🔒 JOIN REQUIRED\n\nYou must join ALL required channels before using the bot.\n\nAfter joining, press ✅ Joined.", Markup.inlineKeyboard(buttons));
}

// ================= HOME ================='''
          s, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'checker replacement failed: {n}')

          # Replace the old UI blocks wherever present.
          ui_pattern = r'if\(notJoined\.length > 0\)\{\s*let buttons =\s*notJoined\.map\(c => \{.*?return ctx\.reply\(\s*`🔒 Please join all channels first\\n\\nThen click ✅ Joined`,\s*Markup\.inlineKeyboard\(buttons\)\s*\);\s*\}'
          s, n = re.subn(ui_pattern, 'if(notJoined.length > 0){\n        return sendStrictForceJoinPrompt(ctx, notJoined);\n    }', s, flags=re.S)
          if n == 0:
              raise SystemExit('old force join UI block not found')

          # Strictly enforce force join on every private interaction, except the Joined check itself and admins.
          home_marker = '// ================= HOME ================='
          middleware = r'''// ================= STRICT FORCE JOIN MIDDLEWARE =================

bot.use(async(ctx, next)=>{
    if(!ctx.from || await isAdmin(ctx.from.id)) return next();
    if((ctx.callbackQuery?.data || "") === "check_join") return next();
    const pending = await checkForceJoin(ctx);
    if(pending.length && ctx.chat?.type === "private") return sendStrictForceJoinPrompt(ctx, pending);
    return next();
});

'''
          if 'STRICT FORCE JOIN MIDDLEWARE' not in s:
              s = s.replace(home_marker, middleware + home_marker, 1)

          p.write_text(s, encoding='utf-8')
          print('strict force join patch prepared')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          node --check index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat: strict force join with private channel support"
          git push
