name: Strict Force Join Fix
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.js
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py && node --check index.js && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.js && git diff --cached --quiet || (git commit -m 'feat: strict force join with private channel support' && git push)