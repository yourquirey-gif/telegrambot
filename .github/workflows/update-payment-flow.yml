name: Update UPI Payment Flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch payment flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.js')
          s = p.read_text()

          # Store UTR.
          if 'utr: { type: String, default: null }' not in s:
              old = '    paymentNote: String,\n    status: {'
              new = '    paymentNote: String,\n    utr: { type: String, default: null },\n    status: {'
              if old not in s:
                  raise SystemExit('Payment schema anchor not found')
              s = s.replace(old, new, 1)

          # Expiry goes back to the manual UPI flow.
          s = s.replace('Markup.button.callback("🔄 Generate New QR", "auto_payment")', 'Markup.button.callback("🔄 Generate New Payment", "manual_payment")')

          # Only UPI payment is shown.
          old = '''        [Markup.button.callback("⚡ Auto Approve Payment", "auto_payment")],
        [Markup.button.callback("📝 Pay by Bot", "manual_payment")],'''
          new = '''        [Markup.button.callback("💳 Pay by UPI", "manual_payment")],'''
          if old in s:
              s = s.replace(old, new, 1)

          # Replace manual payment + auto check block with one UPI flow.
          start = s.index('// ================= MANUAL PAYMENT =================')
          end = s.index('// ================= AUTO PAYMENT CHECK =================')
          manual = r'''// ================= MANUAL PAYMENT =================

async function sendManualPayment(ctx, amount, credits){
    if(!paymentSettings.upiId){
        return ctx.reply(`❌ Payment UPI is not configured yet.\n\nPlease contact admin: ${creditSettings.contact}`);
    }

    const paymentId = makePaymentId();
    const note = makePaymentNote();
    const expiresAt = new Date(Date.now() + 10 * 60 * 1000);

    await Payment.create({
        paymentId,
        userId: String(ctx.from.id),
        amount,
        credits,
        method: "MANUAL",
        paymentNote: note,
        status: "PENDING",
        expiresAt
    });

    const qr = await createPaymentQr(amount, note);

    await ctx.replyWithPhoto(
        { source: qr },
        {
            caption:
`💳 UPI PAYMENT

💰 Amount To Pay
₹${amount.toFixed(2)}

🆔 Payment ID
${paymentId}

📝 Payment Note
${note}

👤 Merchant
${paymentSettings.merchantName}

🏦 UPI ID
${paymentSettings.upiId}

⚠️ IMPORTANT

✅ Pay exactly ₹${amount.toFixed(2)}
✅ Don't change the payment note
✅ QR expires in 10 minutes
✅ After payment click I Have Paid

⏳ Credits will be added only after admin verification.`,
            ...Markup.inlineKeyboard([
                [Markup.button.callback("✅ I Have Paid", `payment_paid_${paymentId}`)],
                [Markup.button.callback("❌ Cancel", `payment_cancel_${paymentId}`)]
            ])
        }
    );

    setTimeout(()=>expirePayment(paymentId), 10 * 60 * 1000 + 2000);
}

bot.action(/payment_paid_(.+)/, async(ctx)=>{
    const paymentId = ctx.match[1];
    const payment = await Payment.findOne({ paymentId, userId: String(ctx.from.id) });

    if(!payment || payment.status !== "PENDING")
        return ctx.answerCbQuery("❌ Payment request expired or already processed", {show_alert:true});

    if(new Date() >= payment.expiresAt){
        await expirePayment(paymentId);
        return ctx.answerCbQuery("⌛ Payment expired", {show_alert:true});
    }

    paymentInput.set(String(ctx.from.id), `UTR:${paymentId}`);
    return ctx.reply(
`🔢 ENTER UTR NUMBER

🆔 Payment ID: ${payment.paymentId}

💰 Amount: ₹${payment.amount}

Please enter the UTR / Transaction ID of your payment.

Example:
123456789012

⚠️ Enter the UTR exactly as shown in your payment app.`,
        Markup.inlineKeyboard([[Markup.button.callback("❌ Cancel", `payment_cancel_${paymentId}`)]])
    );
});

'''
          s = s[:start] + manual + s[end:]

          # Replace check-payment section + message handler.
          start = s.index('// ================= AUTO PAYMENT CHECK =================')
          end = s.index('// ================= PAYMENT ADMIN APPROVAL =================')
          handler = r'''// ================= PAYMENT MESSAGE HANDLER =================

bot.on("message", async(ctx, next)=>{
    if(!ctx.from) return;
    const userId = String(ctx.from.id);
    const input = paymentInput.get(userId);
    if(!input) return next();
    if(ctx.message.text?.startsWith("/")) return next();

    // Admin rejection reason.
    if(String(input).startsWith("REJECT_REASON:")){
        if(!(await isAdmin(ctx.from.id))){
            paymentInput.delete(userId);
            return next();
        }

        const paymentId = String(input).split(":")[1];
        const reason = String(ctx.message.text || "").trim();
        if(!reason) return ctx.reply("❌ Please enter a rejection reason.");

        const payment = await Payment.findOne({ paymentId });
        if(!payment){
            paymentInput.delete(userId);
            return ctx.reply("❌ Payment not found.");
        }

        if(payment.status !== "SUBMITTED"){
            paymentInput.delete(userId);
            return ctx.reply(`❌ Payment is already ${payment.status}.`);
        }

        payment.status = "REJECTED";
        payment.adminId = userId;
        payment.rejectReason = reason;
        await payment.save();
        paymentInput.delete(userId);

        try{
            await bot.telegram.sendMessage(payment.userId,
`❌ PAYMENT REJECTED

🆔 Payment ID: ${payment.paymentId}
💰 Amount: ₹${payment.amount}
🔢 UTR: ${payment.utr || "Not Provided"}

📝 Reason:
${reason}

If you believe this is an error, please contact admin.`);
        }catch{}

        try{ await ctx.editMessageReplyMarkup({ inline_keyboard: [] }); }catch{}
        return ctx.reply(`❌ Payment rejected\n\n🆔 ${payment.paymentId}\n📝 Reason: ${reason}`);
    }

    if(input === "AUTO" || input === "MANUAL"){
        const amount = Number(String(ctx.message.text || "").trim());
        if(!Number.isFinite(amount) || amount <= 0)
            return ctx.reply("❌ Enter a valid amount. Example: 10");

        const pricePerCredit = Number(creditSettings.pricePerCredit);
        const credits = amount / pricePerCredit;
        if(!Number.isInteger(credits))
            return ctx.reply(`❌ Invalid amount.\n\nAmount must be a multiple of ₹${pricePerCredit}.\nExample: ${pricePerCredit * 2}`);

        paymentInput.delete(userId);
        return sendManualPayment(ctx, amount, credits);
    }

    if(String(input).startsWith("UTR:")){
        const paymentId = String(input).split(":")[1];
        const utr = String(ctx.message.text || "").trim();

        if(!utr) return ctx.reply("❌ Please enter a valid UTR number.");
        if(utr.length < 6) return ctx.reply("❌ UTR number looks invalid.\n\nPlease enter the correct UTR.");

        const payment = await Payment.findOne({ paymentId, userId });
        if(!payment){
            paymentInput.delete(userId);
            return ctx.reply("❌ Payment request not found.");
        }

        if(new Date() >= payment.expiresAt){
            paymentInput.delete(userId);
            await expirePayment(paymentId);
            return ctx.reply("⌛ Payment expired. Please create a new payment request.");
        }

        payment.utr = utr;
        await payment.save();
        paymentInput.set(userId, `SCREENSHOT:${paymentId}`);

        return ctx.reply(
`📸 SEND PAYMENT SCREENSHOT

🆔 Payment ID: ${payment.paymentId}

💰 Amount: ₹${payment.amount}

🔢 UTR:
${utr}

Please send the payment screenshot here.

⚠️ Screenshot must clearly show the payment details.`,
            Markup.inlineKeyboard([[Markup.button.callback("❌ Cancel", `payment_cancel_${paymentId}`)]])
        );
    }

    if(String(input).startsWith("SCREENSHOT:")){
        if(!ctx.message.photo)
            return ctx.reply("📸 Please send the payment screenshot as an image.");

        const paymentId = String(input).split(":")[1];
        const payment = await Payment.findOne({ paymentId, userId });

        if(!payment || payment.status !== "PENDING"){
            paymentInput.delete(userId);
            return ctx.reply("❌ Payment request is no longer active.");
        }

        if(new Date() >= payment.expiresAt){
            paymentInput.delete(userId);
            await expirePayment(paymentId);
            return ctx.reply("⌛ Payment expired. Please create a new payment request.");
        }

        const photo = ctx.message.photo.at(-1);
        payment.screenshotFileId = photo.file_id;
        payment.status = "SUBMITTED";
        await payment.save();
        paymentInput.delete(userId);

        await ctx.reply(`✅ Payment request submitted.\n\n🆔 ${payment.paymentId}\n💰 ₹${payment.amount}\n🔢 UTR: ${payment.utr || "Not Provided"}\n\n⏳ Admin verification pending.`);

        const adminIds = [String(OWNER_ID)];
        const admins = await Admin.find();
        admins.forEach(a=>{ if(!adminIds.includes(String(a.userId))) adminIds.push(String(a.userId)); });

        const payer = await User.findOne({ userId: payment.userId });
        const username = payer?.username || "Not Available";

        for(const adminId of adminIds){
            try{
                await bot.telegram.sendPhoto(adminId, photo.file_id, {
                    caption:
`💳 NEW PAYMENT REQUEST

🆔 Payment ID: ${payment.paymentId}
👤 User: ${username}
🆔 User ID: ${payment.userId}
💰 Amount: ₹${payment.amount}
💎 Credits: ${payment.credits}
🔢 UTR: ${payment.utr || "Not Provided"}
📝 Payment Note: ${payment.paymentNote}

⚠️ Verify the screenshot, UTR and payment details before approving.`,
                    ...Markup.inlineKeyboard([[
                        Markup.button.callback("✅ Approve", `approve_payment_${payment.paymentId}`),
                        Markup.button.callback("❌ Reject", `reject_payment_${payment.paymentId}`)
                    ]])
                });
            }catch{}
        }
    }
});

'''
          s = s[:start] + handler + s[end:]

          # Reject button now asks admin for a reason.
          pattern = re.compile(r'bot\.action\(/reject_payment_\(\.\+\)/, async\(ctx\)=>\{.*?\n\}\);', re.S)
          replacement = r'''bot.action(/reject_payment_(.+)/, async(ctx)=>{
    if(!(await isAdmin(ctx.from.id))) return;

    const paymentId = ctx.match[1];
    const payment = await Payment.findOne({ paymentId });
    if(!payment) return ctx.answerCbQuery("❌ Payment not found", {show_alert:true});
    if(payment.status !== "SUBMITTED") return ctx.answerCbQuery(`❌ Already ${payment.status}`, {show_alert:true});

    paymentInput.set(String(ctx.from.id), `REJECT_REASON:${paymentId}`);
    await ctx.answerCbQuery("Enter rejection reason");
    return ctx.reply(
`❌ REJECT PAYMENT

🆔 Payment ID: ${payment.paymentId}
💰 Amount: ₹${payment.amount}
🔢 UTR: ${payment.utr || "Not Provided"}

Please enter the reason for rejecting this payment.`
    );
});'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Reject handler not found')

          p.write_text(s)
          print('Payment flow patch applied.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet && exit 0
          git commit -m "Update UPI payment verification flow"
          git push

      - name: Cleanup temporary files
        if: success()
        run: |
          rm -f .payment-flow-trigger .github/workflows/update-payment-flow.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Cleanup payment flow updater"
          git push
